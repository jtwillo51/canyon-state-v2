[project]
name = "canyon-state-api"
version = "0.1.0"
description = "Canyon State v2 API: FastAPI + SQLAlchemy (async) + Postgres"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "inngest==0.5.19",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The Inngest SDK (0.5.x) still uses Pydantic v1-style config internally; that's theirs to fix, not a
# problem in this code. Only that module's deprecation warnings are hidden.
filterwarnings = ["ignore::DeprecationWarning:inngest.*"]
