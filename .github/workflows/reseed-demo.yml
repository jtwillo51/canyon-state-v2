# Nightly: put the public demo's database back to fresh synthetic data, so whatever visitors changed
# is undone and "last 30 days" stays current. Also runnable by hand from the Actions tab.
name: Reseed demo

on:
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC = 3:00 am in Arizona
  workflow_dispatch:

jobs:
  reseed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
      DEMO_MODE: "true" # the seed script refuses a non-local database without it
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (third-party: pinned to a commit)
      - run: uv sync --frozen --no-dev
      - run: uv run alembic upgrade head
      - run: uv run python -m scripts.seed
      - run: uv run python -m scripts.run_jobs # stale nudges and digests, so the demo has notifications
